# Drop-in for the `writer` unit: /etc/systemd/system/writer.service.d/lane.conf
# Makes `writer` the HyperEVM (998) lane behind writer.hyperflip.xyz on port 8787.
# systemd Environment= beats the shared /opt/hype/.env, whose vault, deploy block and
# WRITER_RPC are Elysium's (used as-is by writer-elysium.service).
[Service]
Environment=DEPLOYMENT_FILE=/opt/hype/registry/deployment.hyperevm-testnet.json
Environment=PARLAY_VAULT_ADDRESS=0x407cdc0b15e8d81f4d122481ecf92dbe07dc0169
Environment=PARLAY_DEPLOY_BLOCK=61906227
# The poker scans 100-block chunks and the v1 deploy block is millions back, so start near
# the lane's launch. Tickets minted before this block are not poked (one-off resolveParlay loop).
Environment=PARLAY_INDEX_FROM_BLOCK=66590000
# Empty on purpose: config falls back to TESTNET_RPC (998), whose order favours precompiles
# (official first). The .env WRITER_RPC is Elysium's.
Environment=WRITER_RPC=
# The boot identity check reads vault code at the deploy block and the block before it, which
# only an archive node answers; the official node returns live code for both and fails the check.
# Public dRPC is the only 998 archive node (see the RPC Endpoints note). 2026-10-28.
Environment=ARCHIVE_RPC=https://hyperliquid-testnet.drpc.org
