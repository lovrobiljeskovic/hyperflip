name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_WRITER_URL: http://127.0.0.1:1
  NEXT_PUBLIC_INFO_API: http://127.0.0.1:1
  NEXT_PUBLIC_PARLAY_VAULT: "0x1111111111111111111111111111111111111111"
  NEXT_PUBLIC_PARLAY_DEPLOY_BLOCK: "1"

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            keeper/package-lock.json
            writer/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          for project in keeper writer web; do
            npm ci --prefix "$project"
          done

      - name: Verify repository
        run: bash scripts/verify.sh
