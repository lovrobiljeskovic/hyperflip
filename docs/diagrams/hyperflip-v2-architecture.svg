<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1300" viewBox="0 0 1860 1300" font-family="'Architects Daughter','Comic Sans MS','Segoe Print',cursive">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fc4"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2691e"/></marker>
  </defs>
  <rect width="1860" height="1300" fill="#fff"/>
  <rect x="20" y="20" width="1820" height="1260" rx="14" fill="none" stroke="#111" stroke-width="2"/>
  <text x="40" y="58" font-size="26" fill="#111">Hyperflip v2: multi-maker RFQ with cross-margin (final proposed shape, 2026-09-28)</text>
  <text x="40" y="84" font-size="15" fill="#555">One chain for the money path. Every contract that holds a Core balance, or must see collateral, hedges and liabilities in one transaction, lives on HyperEVM. Elysium is not on the money path.</text>

  <!-- bands -->
  <g stroke-width="1.5" stroke-dasharray="6 6">
    <rect x="40" y="100" width="1780" height="140" rx="10" fill="#fff7e6" stroke="#d9a441"/>
    <rect x="40" y="330" width="1680" height="470" rx="10" fill="#f3f3f3" stroke="#999"/>
    <rect x="40" y="850" width="1780" height="250" rx="10" fill="#f3fbf1" stroke="#7fb37a"/>
  </g>
  <text x="56" y="126" font-size="20" fill="#111">HyperCore</text>
  <text x="56" y="356" font-size="20" fill="#111">HyperEVM (998): tickets, escrow, margin, settlement source, 1 s blocks</text>
  <text x="56" y="876" font-size="20" fill="#111">Off-chain</text>

  <!-- HyperCore boxes -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="60" y="140" width="440" height="85" rx="6"/>
    <rect x="520" y="140" width="560" height="85" rx="6"/>
    <rect x="1100" y="140" width="700" height="85" rx="6"/>
  </g>
  <g font-size="14" fill="#111">
    <text x="72" y="162" font-size="16">HIP-4 outcome books (singles)</text>
    <text x="72" y="184">resting orders, fills, fees; makers hedge here</text>
    <text x="72" y="204">orders sent via CoreWriter are delayed a few seconds</text>
    <text x="532" y="162" font-size="16">Settlement</text>
    <text x="532" y="184">outcomeStatus 2 + settledValue, then pruned (2 to 3)</text>
    <text x="532" y="204">deployer settles (venues flip / flp), or deadline = 0.5</text>
    <text x="1112" y="162" font-size="16">Core-side balances of HyperEVM contracts (same address on both layers)</text>
    <text x="1112" y="184">OutcomeVault #n's account: the oYES / oNO backing for one outcome</text>
    <text x="1112" y="204">MarginVault #m's account: that maker's hedge positions and hedge cash</text>
  </g>

  <!-- HyperEVM boxes -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="60" y="380" width="300" height="190" rx="6"/>
    <rect x="380" y="380" width="320" height="190" rx="6"/>
    <rect x="750" y="380" width="360" height="190" rx="6"/>
    <rect x="60" y="640" width="300" height="110" rx="6"/>
    <rect x="380" y="640" width="320" height="110" rx="6" stroke-dasharray="8 6"/>
    <rect x="750" y="640" width="360" height="110" rx="6"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="72" y="404" font-size="16">OutcomeVault (per outcome)</text>
    <text x="72" y="428">is a Core account; split / merge</text>
    <text x="72" y="448">settle() at status 2, in prune window</text>
    <text x="72" y="468">stores settleFractionWad forever</text>
    <text x="72" y="488">views: settled(), settleFractionWad()</text>
    <text x="72" y="508">carries the HIP-4 question id</text>
    <text x="72" y="528">(the free partition bound)</text>

    <text x="392" y="404" font-size="16">MarginVault (per maker)</text>
    <text x="392" y="428">own Core account + cash_evm (USDC)</text>
    <text x="392" y="448">hedge(): order via that maker's API wallet</text>
    <text x="392" y="468">confirmHedge(): reads 0x801, records qty</text>
    <text x="392" y="488">requirement = sum over questions of the</text>
    <text x="392" y="508">  worst outcome, minus confirmed hedges</text>
    <text x="392" y="528">lock(id, amt) for ParlayVault; frozen, never</text>
    <text x="392" y="548">  under water; withdraw cash_evm - requirement</text>

    <text x="762" y="404" font-size="16">ParlayVault v2 (multi-maker)</text>
    <text x="762" y="428">ERC-721 ticket; Quote carries the maker</text>
    <text x="762" y="448">signerOf[maker] registry; replay key (maker, id)</text>
    <text x="762" y="468">escrow: approved maker => MarginVault.lock()</text>
    <text x="762" y="488">  else safeTransferFrom(maker allowance)</text>
    <text x="762" y="508">taker pays premium; premium stays in the pot</text>
    <text x="762" y="528">resolveParlay: Dead / Void / Won off leg views</text>
    <text x="762" y="548">protocol fee on premium (Stage 5)</text>

    <text x="72" y="664" font-size="16">KeeperVerifier</text>
    <text x="72" y="688">split / merge execution attestation</text>
    <text x="72" y="708">swappable for a 0x801-backed verifier</text>
    <text x="72" y="728">(setVerifier, no vault change)</text>

    <text x="392" y="664" font-size="16">RelationAttestor (Stage 4)</text>
    <text x="392" y="688">curated cross-question relations</text>
    <text x="392" y="708">attest + delay + pause, KeeperVerifier pattern</text>
    <text x="392" y="728">may only lower a requirement, within a cap</text>

    <text x="762" y="664" font-size="16">Escrow whitelist</text>
    <text x="762" y="688">owner-only setMaker(maker, signer)</text>
    <text x="762" y="708">approvedEscrow[maker]: a malicious escrow</text>
    <text x="762" y="728">source could leave takers unpaid</text>
  </g>

  <!-- Elysium note inside the chain area -->
  <g fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="10 8">
    <rect x="1160" y="380" width="530" height="370" rx="6"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="1176" y="404" font-size="16">Where Elysium fits in v2: not on the money path</text>
    <text x="1176" y="432">An Elysium contract cannot own a Core account (Kinetiq's design,</text>
    <text x="1176" y="452">not a phase 2 gap) and cannot see 998 collateral in its own</text>
    <text x="1176" y="472">transaction. Bridging is not atomic in either direction.</text>
    <text x="1176" y="500">The solvency check needs collateral, confirmed hedges and</text>
    <text x="1176" y="520">liabilities in one transaction, so all three sit on 998.</text>
    <text x="1176" y="548">Hedge latency does not need Elysium either: a maker's API wallet</text>
    <text x="1176" y="568">on its MarginVault's Core account trades through the exchange</text>
    <text x="1176" y="588">API, about one Core block, with no CoreWriter delay.</text>
    <text x="1176" y="616">What Elysium could add later, read-only: keeper-free settlement</text>
    <text x="1176" y="636">past Core's prune window (phase 2, with a retention commitment)</text>
    <text x="1176" y="656">and on-chain book depth for a verifiable premium floor. Both are</text>
    <text x="1176" y="676">consumers of settled state, not holders of money.</text>
    <text x="1176" y="704">The Elysium-side cross-margin variant (engine on Elysium, custody</text>
    <text x="1176" y="724">in a 998 twin) works but adds three trusted parties for no</text>
    <text x="1176" y="744">capital gain. See the roadmap note.</text>
  </g>

  <!-- Off-chain boxes -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="60" y="900" width="250" height="110" rx="6"/>
    <rect x="340" y="900" width="230" height="110" rx="6"/>
    <rect x="600" y="900" width="290" height="110" rx="6"/>
    <rect x="928" y="908" width="330" height="120" rx="6" stroke="#999"/>
    <rect x="920" y="900" width="330" height="120" rx="6"/>
    <rect x="1290" y="900" width="230" height="120" rx="6"/>
    <rect x="1550" y="900" width="250" height="170" rx="6"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="72" y="924" font-size="16">Registry + rotation</text>
    <text x="72" y="948">markets.json: vault per outcome</text>
    <text x="72" y="968">house deployer: NFL + soccer</text>
    <text x="72" y="988">priors from external odds</text>

    <text x="352" y="924" font-size="16">Web (Next.js)</text>
    <text x="352" y="948">build slip, send intent</text>
    <text x="352" y="968">show "best of N"</text>
    <text x="352" y="988">approve + mint(quote, sig)</text>

    <text x="612" y="924" font-size="16">RFQ relay (public, neutral)</text>
    <text x="612" y="948">fan out intent, 1.5 s window</text>
    <text x="612" y="968">best maxPayout wins, tie lowest addr</text>
    <text x="612" y="988">journal every answer, incl. losers</text>

    <text x="932" y="924" font-size="16">Maker clients, N of them (house is one)</text>
    <text x="932" y="948">own pricing model, external odds + Core book</text>
    <text x="932" y="968">firm EIP-712 quote, no last look, TTL >= 8 s</text>
    <text x="932" y="988">hedge policy: which legs, when, how much</text>
    <text x="932" y="1008">own signer, own MarginVault, own API wallet</text>

    <text x="1302" y="924" font-size="16">API wallet (per maker)</text>
    <text x="1302" y="948">approved by its MarginVault</text>
    <text x="1302" y="968">(CoreWriter action 9)</text>
    <text x="1302" y="988">trade-only, cannot withdraw</text>
    <text x="1302" y="1008">renew before expiry (180 d)</text>

    <text x="1562" y="924" font-size="16">Keeper (cranks)</text>
    <text x="1562" y="948">OutcomeVault.settle()</text>
    <text x="1562" y="968">  inside the prune window</text>
    <text x="1562" y="988">MarginVault.confirmHedge()</text>
    <text x="1562" y="1008">Core to EVM sweeps</text>
    <text x="1562" y="1028">resolveParlay() Dead / Void</text>
    <text x="1562" y="1048">KeeperVerifier attestations</text>
  </g>

  <!-- HyperCore edges: CoreWriter (black dotted) and precompile reads (blue dashed) -->
  <g stroke="#111" stroke-width="2" fill="none" stroke-dasharray="3 5" marker-end="url(#ah)">
    <line x1="100" y1="380" x2="100" y2="244"/>
    <line x1="420" y1="380" x2="420" y2="244"/>
  </g>
  <g stroke="#2f5fc4" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#ahb)">
    <line x1="116" y1="380" x2="116" y2="244"/>
    <line x1="436" y1="380" x2="436" y2="244"/>
  </g>
  <g font-size="12">
    <text x="126" y="264" fill="#111">CoreWriter: split / merge, spotSend (async)</text>
    <text x="126" y="300" fill="#2f5fc4">0x814 status, 0x801 balances</text>
    <text x="446" y="264" fill="#111">CoreWriter: spotSend sweeps only (async)</text>
    <text x="446" y="300" fill="#2f5fc4">0x801 hedge positions (confirmHedge, atomic in one tx)</text>
  </g>

  <!-- same-chain calls (black solid) -->
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="750" y1="470" x2="702" y2="470"/>
    <path d="M820,572 V610 H210 V572"/>
    <line x1="540" y1="640" x2="540" y2="572"/>
    <line x1="930" y1="640" x2="930" y2="572"/>
  </g>
  <g font-size="12" fill="#111">
    <text x="726" y="458" text-anchor="middle">lock()</text>
    <text x="440" y="628">ParlayVault reads each leg's settled(), settleFractionWad(), question</text>
    <text x="548" y="594">lowers requirement, within cap</text>
    <text x="938" y="608">gates lock()</text>
  </g>

  <!-- off-chain flows (orange) -->
  <g stroke="#d2691e" stroke-width="2" fill="none">
    <line x1="310" y1="955" x2="332" y2="955" marker-end="url(#aho)"/>
    <line x1="570" y1="955" x2="592" y2="955" marker-end="url(#aho)" marker-start="url(#aho)"/>
    <line x1="890" y1="955" x2="912" y2="955" marker-end="url(#aho)" marker-start="url(#aho)"/>
    <line x1="1250" y1="960" x2="1282" y2="960" marker-end="url(#aho)"/>
    <path d="M455,900 V826 H930 V572" marker-end="url(#aho)"/>
    <path d="M1405,900 V826 H1770 V244" marker-end="url(#aho)"/>
  </g>
  <g font-size="12" fill="#d2691e">
    <text x="465" y="818">taker: approve + mint(quote, sig) against the winning maker's quote</text>
    <text x="330" y="1040">intent out, best quote back</text>
    <text x="600" y="1040">POST /rfq to each maker, bearer token; quotes back inside the window</text>
    <text x="1300" y="1040">signs orders as the agent</text>
    <text x="1780" y="800" transform="rotate(-90 1780 800)">API wallet: orders on its MarginVault's Core account, about one Core block</text>
  </g>

  <!-- legend + flow summary -->
  <g fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="10 8">
    <rect x="40" y="1130" width="760" height="130" rx="6"/>
    <rect x="820" y="1130" width="1000" height="130" rx="6"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="56" y="1154" font-size="15">Legend, by what you trust</text>
    <line x1="56" y1="1174" x2="110" y2="1174" stroke="#111" stroke-width="2"/><text x="120" y="1178">same-chain call, atomic</text>
    <line x1="56" y1="1196" x2="110" y2="1196" stroke="#111" stroke-width="2" stroke-dasharray="3 5"/><text x="120" y="1200">CoreWriter action: async, no return value, fails silently; never on the margin check</text>
    <line x1="56" y1="1218" x2="110" y2="1218" stroke="#2f5fc4" stroke-width="2" stroke-dasharray="7 5"/><text x="120" y="1222">precompile read: Core state as of block construction, backed by Core consensus</text>
    <line x1="56" y1="1240" x2="110" y2="1240" stroke="#d2691e" stroke-width="2"/><text x="120" y="1244">off-chain: HTTP, EIP-712 quotes, exchange API</text>

    <text x="836" y="1154" font-size="15">One ticket, end to end</text>
    <text x="836" y="1178">1. Taker builds a slip; relay fans the intent to N makers; each prices off singles and returns a firm quote; best payout wins.</text>
    <text x="836" y="1200">2. Taker mints. ParlayVault pulls the premium from the taker and locks maxPayout - premium inside the winner's MarginVault.</text>
    <text x="836" y="1222">3. Maker hedges a leg via its API wallet; keeper cranks confirmHedge; the vault reads 0x801 and lowers the requirement.</text>
    <text x="836" y="1244">4. Legs settle on Core; vaults cache the fraction; resolveParlay pays Won from the lock, refunds Void, keeps Dead for the maker.</text>
  </g>
</svg>
